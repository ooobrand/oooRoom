<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ooo · الغرفة الافتراضية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Tajawal', -apple-system, sans-serif; background: #fff; color: #0a0a0a; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #0a0a0a; background: #fff; position: sticky; top: 0; z-index: 50; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { display: flex; align-items: center; gap: 2px; font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -3px; line-height: 1; }
  .brand-mark .o-broken { position: relative; display: inline-block; }
  .brand-mark .o-broken::after { content: ''; position: absolute; top: 50%; left: 100%; width: 7px; height: 3px; background: #0a0a0a; transform: translateY(-50%) rotate(35deg); margin-left: -3px; }
  .brand-name { font-size: 10px; letter-spacing: 4px; opacity: 0.7; padding-top: 6px; }
  .top-tag { font-size: 9px; letter-spacing: 2px; opacity: 0.6; border: 1px solid #0a0a0a; padding: 4px 10px; border-radius: 30px; }
  
  .welcome { min-height: calc(100vh - 70px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; text-align: center; }
  .welcome-tag { font-size: 10px; letter-spacing: 4px; opacity: 0.5; margin-bottom: 14px; }
  
  .hero-logo { font-family: 'Inter', sans-serif; font-size: clamp(70px, 16vw, 120px); font-weight: 700; letter-spacing: -8px; line-height: 0.9; margin-bottom: 18px; display: flex; align-items: center; gap: 4px; justify-content: center; }
  .hero-logo .o-broken { position: relative; display: inline-block; }
  .hero-logo .o-broken::after { content: ''; position: absolute; top: 50%; left: 100%; width: 24px; height: 7px; background: #0a0a0a; transform: translateY(-50%) rotate(35deg); margin-left: -8px; }
  
  .welcome-title { font-size: clamp(26px, 5.5vw, 40px); font-weight: 300; line-height: 1.2; margin-bottom: 12px; letter-spacing: -0.5px; }
  .welcome-title strong { font-weight: 700; position: relative; display: inline-block; }
  .welcome-title strong::after { content: ''; position: absolute; bottom: 6px; right: 0; width: 100%; height: 7px; background: #0a0a0a; z-index: -1; opacity: 0.12; }
  
  .welcome-sub { font-size: 14px; line-height: 1.8; max-width: 420px; opacity: 0.65; margin-bottom: 32px; font-weight: 300; }
  
  .method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; max-width: 500px; width: 100%; margin-bottom: 24px; }
  .method-card { background: #fff; border: 1.5px solid #0a0a0a; padding: 22px 16px; cursor: pointer; transition: all 0.3s; text-align: center; font-family: inherit; color: #0a0a0a; -webkit-appearance: none; }
  .method-card:active { background: #0a0a0a; color: #fff; }
  .method-icon { width: 40px; height: 40px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
  .method-icon svg { width: 100%; height: 100%; fill: currentColor; }
  .method-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .method-desc { font-size: 11px; opacity: 0.7; line-height: 1.6; }
  .method-tag { display: inline-block; margin-top: 8px; font-size: 9px; padding: 3px 9px; background: rgba(10,10,10,0.08); border-radius: 10px; letter-spacing: 1px; font-weight: 500; }
  .method-card:active .method-tag { background: rgba(255,255,255,0.15); }
  .privacy-note { font-size: 10px; opacity: 0.4; margin-top: 4px; }
  
  .studio { display: none; min-height: calc(100vh - 70px); padding: 16px; }
  .studio.active { display: block; }
  .studio-layout { display: grid; grid-template-columns: 1fr; gap: 14px; max-width: 1200px; margin: 0 auto; }
  @media (min-width: 900px) { .studio-layout { grid-template-columns: 1fr 280px; } }
  
  .preview-area { background: #f5f5f5; border-radius: 12px; position: relative; aspect-ratio: 3/4; overflow: hidden; min-height: 380px; }
  #userPhoto, #userVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #userVideo { transform: scaleX(-1); -webkit-transform: scaleX(-1); }
  #glassesCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  
  .preview-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(0,0,0,0.5); gap: 12px; padding: 20px; text-align: center; z-index: 5; background: #f5f5f5; }
  .preview-empty.hidden { display: none; }
  .preview-empty svg { width: 48px; height: 48px; opacity: 0.4; }
  .preview-empty p { font-size: 13px; line-height: 1.6; }
  
  .preview-status { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 5px 11px; border-radius: 20px; z-index: 10; display: none; }
  .preview-status.show { display: block; }
  .preview-status.success { background: rgba(34, 197, 94, 0.9); }
  .preview-status.warning { background: rgba(251, 191, 36, 0.9); color: #000; }
  
  .position-controls { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.75); border-radius: 12px; padding: 8px; display: none; flex-direction: column; gap: 5px; z-index: 10; }
  .position-controls.show { display: flex; }
  .pos-btn { width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; -webkit-appearance: none; font-family: inherit; font-weight: 500; }
  .pos-btn:active { background: rgba(255,255,255,0.3); }
  .pos-row { display: flex; gap: 5px; justify-content: center; }
  .pos-label { font-size: 8px; color: #fff; opacity: 0.7; text-align: center; letter-spacing: 1px; margin-bottom: 2px; }
  
  .sidebar { display: flex; flex-direction: column; gap: 14px; }
  .section-label { font-size: 10px; letter-spacing: 3px; opacity: 0.5; margin-bottom: 10px; }
  
  .product-card { background: #fff; border: 1.5px solid #0a0a0a; border-radius: 12px; padding: 16px; text-align: center; }
  .product-img-wrap { background: #f8f8f8; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .product-img-wrap img { width: 100%; height: auto; max-height: 80px; object-fit: contain; }
  .product-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; font-family: 'Inter', sans-serif; letter-spacing: 0.5px; }
  .product-color { font-size: 11px; opacity: 0.6; margin-bottom: 10px; }
  .product-tag { display: inline-block; font-size: 9px; padding: 4px 10px; background: rgba(10,10,10,0.06); border-radius: 10px; letter-spacing: 1px; font-weight: 500; }
  
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .action-btn { background: #fff; border: 1px solid #0a0a0a; color: #0a0a0a; padding: 11px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 5px; -webkit-appearance: none; }
  .action-btn.primary { background: #0a0a0a; color: #fff; grid-column: span 2; padding: 14px; font-size: 13px; }
  
  .back-btn { background: none; border: none; color: #0a0a0a; cursor: pointer; font-size: 13px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-family: inherit; margin-bottom: 10px; -webkit-appearance: none; }
  
  #fileInput { display: none; }
  
  .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; gap: 14px; z-index: 20; padding: 20px; text-align: center; }
  .loading-overlay.show { display: flex; }
  .spinner { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(120px); background: #0a0a0a; color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 12px; z-index: 100; transition: transform 0.3s; max-width: 90%; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">
    <div class="brand-mark"><span>o</span><span class="o-broken">o</span><span>o</span></div>
    <div class="brand-name">TRIPLE O</div>
  </div>
  <div class="top-tag">VIRTUAL ROOM</div>
</div>

<div class="welcome" id="welcomeScreen">
  <div class="welcome-tag">EYEWEAR · BREAK THE FRAME</div>
  <div class="hero-logo"><span>o</span><span class="o-broken">o</span><span>o</span></div>
  <h1 class="welcome-title">جربها <strong>قبل ما تشتريها</strong></h1>
  <p class="welcome-sub">شوف كيف تبين النظارة على وجهك من جوالك مباشرة</p>
  
  <div class="method-grid">
    <button class="method-card" id="useCameraBtn">
      <div class="method-icon"><svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></div>
      <div class="method-title">تجربة حية</div>
      <div class="method-desc">شغّل الكاميرا</div>
      <div class="method-tag">LIVE</div>
    </button>
    <button class="method-card" id="useUploadBtn">
      <div class="method-icon"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>
      <div class="method-title">ارفع صورتك</div>
      <div class="method-desc">سيلفي من جهازك</div>
      <div class="method-tag">RECOMMENDED</div>
    </button>
  </div>
  
  <p class="privacy-note">🔒 صورك على جهازك فقط</p>
</div>

<input type="file" id="fileInput" accept="image/*">

<div class="studio" id="studioScreen">
  <button class="back-btn" id="backBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l1.41 1.41L7.83 11H20v2H7.83l5.58 5.59L12 20l-8-8 8-8z"/></svg>
    رجوع
  </button>
  
  <div class="studio-layout">
    <div class="preview-area" id="previewArea">
      <img id="userPhoto" style="display:none;" alt="">
      <video id="userVideo" autoplay playsinline muted webkit-playsinline style="display:none;"></video>
      <canvas id="glassesCanvas"></canvas>
      
      <div class="preview-empty" id="previewEmpty">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        <p id="emptyText">جاري التجهيز...</p>
      </div>
      
      <div class="preview-status" id="previewStatus"></div>
      
      <div class="position-controls" id="posControls">
        <div class="pos-label">تعديل</div>
        <div class="pos-row"><button class="pos-btn" data-action="up">↑</button></div>
        <div class="pos-row"><button class="pos-btn" data-action="left">←</button><button class="pos-btn" data-action="right">→</button></div>
        <div class="pos-row"><button class="pos-btn" data-action="down">↓</button></div>
        <div class="pos-row"><button class="pos-btn" data-action="bigger">+</button><button class="pos-btn" data-action="smaller">−</button></div>
      </div>
      
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingMessage" style="font-size: 13px;">جاري التحميل...</p>
      </div>
    </div>
    
    <div class="sidebar">
      <div>
        <div class="section-label">MODEL · الموديل</div>
        <div class="product-card">
          <div class="product-img-wrap">

  var yawAbs = Math.abs(det.yaw);
  var yawScale = Math.cos(det.yaw);
  if (yawScale < 0.2) yawScale = 0.2;
  
  // تطبيق التحويلات
  ctx.scale(yawScale, pitchScale);
  
  // إذا اللف قوي جداً، ما نعرض النظارة (الوجه مش مقابل)
  if (yawAbs < Math.PI / 2.2) {
    ctx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );
  }
  
  ctx.restore();
}

function redraw() {
  if (!lastDetection) return;
  ctx.clearRect(0, 0, glassesCanvas.width, glassesCanvas.height);
  drawGlasses3D(lastDetection);
}

function fitCanvas() {
  var rect = previewArea.getBoundingClientRect();
  glassesCanvas.width = rect.width;
  glassesCanvas.height = rect.height;
}

function initFaceMesh() {
  return new Promise(function(resolve, reject) {
    if (state.faceMesh) { resolve(state.faceMesh); return; }
    if (typeof FaceMesh === 'undefined') {
      reject(new Error('MediaPipe library not loaded'));
      return;
    }
    try {
      var fm = new FaceMesh({
        locateFile: function(file) {
          return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/' + file;
        }
      });
      fm.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      fm.onResults(onFaceMeshResults);
      state.faceMesh = fm;
      resolve(fm);
    } catch (err) {
      reject(err);
    }
  });
}

// تحويل إحداثيات نقطة من نسبية إلى canvas مع object-fit cover
function projectPoint(lm, srcW, srcH, canvasW, canvasH, mirror) {
  var srcAspect = srcW / srcH;
  var canvasAspect = canvasW / canvasH;
  var dw, dh, ox, oy;
  if (srcAspect > canvasAspect) {
    dh = canvasH; dw = canvasH * srcAspect;
    ox = (canvasW - dw) / 2; oy = 0;
  } else {
    dw = canvasW; dh = canvasW / srcAspect;
    ox = 0; oy = (canvasH - dh) / 2;
  }
  var px = lm.x * dw + ox;
  var py = lm.y * dh + oy;
  if (mirror) px = canvasW - px;
  return { x: px, y: py, z: lm.z };
}

function onFaceMeshResults(results) {
  ctx.clearRect(0, 0, glassesCanvas.width, glassesCanvas.height);
  
  if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
    if (state.mode === 'camera') showStatus('وجّه وجهك للكاميرا', 'warning');
    return;
  }
  
  var lm = results.multiFaceLandmarks[0];
  var canvasW = glassesCanvas.width;
  var canvasH = glassesCanvas.height;
  var srcW = state.mode === 'camera' ? userVideo.videoWidth : userPhoto.naturalWidth;
  var srcH = state.mode === 'camera' ? userVideo.videoHeight : userPhoto.naturalHeight;
  if (!srcW || !srcH) return;
  
  var mirror = state.mode === 'camera';
  
  // النقاط المرجعية المهمة:
  // 33  = الزاوية الخارجية للعين اليسرى
  // 263 = الزاوية الخارجية للعين اليمنى  
  // 168 = جسر الأنف (بين العينين)
  // 8   = أعلى الأنف
  // 152 = الذقن (أسفل الوجه)
  // 10  = أعلى الجبهة
  
  var leftEye = projectPoint(lm[33], srcW, srcH, canvasW, canvasH, mirror);
  var rightEye = projectPoint(lm[263], srcW, srcH, canvasW, canvasH, mirror);
  var noseBridge = projectPoint(lm[168], srcW, srcH, canvasW, canvasH, mirror);
  var noseTip = projectPoint(lm[1], srcW, srcH, canvasW, canvasH, mirror);
  var forehead = projectPoint(lm[10], srcW, srcH, canvasW, canvasH, mirror);
  var chin = projectPoint(lm[152], srcW, srcH, canvasW, canvasH, mirror);
  
  // مركز النظارة = جسر الأنف
  var cx = noseBridge.x;
  var cy = noseBridge.y;
  
  // عرض النظارة = المسافة بين الصدغين × معامل
  // نستخدم نقاط الصدغ 234 (يسار) و 454 (يمين)
  var templeL = projectPoint(lm[234], srcW, srcH, canvasW, canvasH, mirror);
  var templeR = projectPoint(lm[454], srcW, srcH, canvasW, canvasH, mirror);
  var templeDist = Math.sqrt(
    (templeR.x - templeL.x) * (templeR.x - templeL.x) +
    (templeR.y - templeL.y) * (templeR.y - templeL.y)
  );
  var glassesWidth = templeDist * 1.05;
  
  // === حساب الزوايا الثلاث ===
  
  // 1. Roll (الميلان) - من خط العينين
  var roll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
  
  // 2. Yaw (اللف يمين/يسار)
  // نقارن المسافة من جسر الأنف لكل عين
  // لو متساوية = الوجه مقابل، لو وحدة أقصر = ملتفت
  var eyeMidX = (leftEye.x + rightEye.x) / 2;
  var eyeMidY = (leftEye.y + rightEye.y) / 2;
  var faceWidth = Math.sqrt(
    (rightEye.x - leftEye.x) * (rightEye.x - leftEye.x) +
    (rightEye.y - leftEye.y) * (rightEye.y - leftEye.y)
  );
  
  // الانحراف الأفقي للأنف من منتصف العينين
  var noseOffsetX = noseTip.x - eyeMidX;
  // نطبّع على عرض الوجه
  var yawRatio = noseOffsetX / (faceWidth / 2);
  // تحويل إلى زاوية (بالراديان)
  var yaw = Math.atan(yawRatio * 0.8);
  if (mirror) yaw = -yaw;
  
  // 3. Pitch (الإيماء فوق/تحت)
  // نقارن المسافة من العينين للذقن مع المسافة من العينين للجبهة
  var foreheadDist = Math.sqrt(
    (forehead.x - eyeMidX) * (forehead.x - eyeMidX) +
    (forehead.y - eyeMidY) * (forehead.y - eyeMidY)
  );
  var chinDist = Math.sqrt(
    (chin.x - eyeMidX) * (chin.x - eyeMidX) +
    (chin.y - eyeMidY) * (chin.y - eyeMidY)
  );
  
  // نسبة الذقن للجبهة (الطبيعي ~2.0)
  var pitchRatio = chinDist / (foreheadDist + chinDist) - 0.65;
  var pitch = pitchRatio * 1.5;
  
  // تخزين النتيجة
  var raw = {
    x: cx,
    y: cy,
    width: glassesWidth,
    height: glassesWidth * (glassesImg.height / (glassesImg.width || 1)),
    roll: roll,
    yaw: yaw,
    pitch: pitch
  };
  
  // تنعيم
  lastDetection = smoothDetection(raw);
  drawGlasses3D(lastDetection);
  
  if (state.mode === 'camera') showStatus('وجه مكتشف ✓', 'success');
}

function startCameraMode() {
  state.mode = 'camera';
  smoothed = null;
  manualOffset = { x: 0, y: 0, scale: 1 };
  showStudio();
  userPhoto.style.display = 'none';
  userVideo.style.display = 'block';
  posControls.classList.remove('show');
  emptyText.textContent = 'جاري تشغيل الكاميرا...';
  loadingOverlay.classList.add('show');
  loadingMessage.textContent = 'تشغيل الكاميرا...';
  
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  }).then(function(stream) {
    state.videoStream = stream;
    userVideo.srcObject = stream;
    return new Promise(function(resolve) {
      userVideo.onloadedmetadata = function() {
        userVideo.play();
        resolve();
      };
    });
  }).then(function() {
    loadingMessage.textContent = 'تحميل تتبع الوجه...';
    return initFaceMesh();
  }).then(function(fm) {
    loadingOverlay.classList.remove('show');
    previewEmpty.classList.add('hidden');
    fitCanvas();
    
    function detect() {
      if (state.mode !== 'camera') return;
      if (!state.isProcessing && userVideo.readyState >= 2) {
        state.isProcessing = true;
        fm.send({ image: userVideo }).then(function() {
          state.isProcessing = false;
        }).catch(function() {
          state.isProcessing = false;
        });
      }
      requestAnimationFrame(detect);
    }
    detect();
  }).catch(function(err) {
    loadingOverlay.classList.remove('show');
    var msg = 'حصل خطأ';
    if (err.name === 'NotAllowedError') msg = 'تم رفض إذن الكاميرا';
    else if (err.name === 'NotFoundError') msg = 'ما لقيت كاميرا';
    else msg = 'فشل التحميل - جرب رفع صورة بدلاً';
    emptyText.textContent = msg;
    previewEmpty.classList.remove('hidden');
    showToast(msg);
  });
}

function startUploadMode() {
  $('fileInput').click();
}

function handleFileSelected(e) {
  var file = e.target.files[0];
  if (!file) return;
  
  state.mode = 'upload';
  smoothed = null;
  manualOffset = { x: 0, y: 0, scale: 1 };
  showStudio();
  userVideo.style.display = 'none';
  userPhoto.style.display = 'block';
  posControls.classList.add('show');
  emptyText.textContent = 'جاري المعالجة...';
  loadingOverlay.classList.add('show');
  loadingMessage.textContent = 'معالجة الصورة...';
  
  var reader = new FileReader();
  reader.onload = function(ev) {
    userPhoto.src = ev.target.result;
    userPhoto.onload = function() {
      initFaceMesh().then(function(fm) {
        loadingMessage.textContent = 'البحث عن الوجه...';
        previewEmpty.classList.add('hidden');
        fitCanvas();
        
        var img = new Image();
        img.onload = function() {
          fm.send({ image: img }).then(function() {
            loadingOverlay.classList.remove('show');
            if (!lastDetection) {
              showStatus('استخدم الأسهم للتعديل', 'warning');
              var cw = glassesCanvas.width, ch = glassesCanvas.height;
              lastDetection = {
                x: cw / 2, y: ch * 0.4,
                width: cw * 0.5, height: cw * 0.2,
                roll: 0, yaw: 0, pitch: 0
              };
              redraw();
            } else {
              showStatus('وجه مكتشف ✓', 'success');
            }
          });
        };
        img.src = userPhoto.src;
      }).catch(function() {
        loadingOverlay.classList.remove('show');
        showToast('فشل تحميل النموذج');
      });
    };
  };
  reader.readAsDataURL(file);
}

function showStudio() {
  welcomeScreen.style.display = 'none';
  studioScreen.classList.add('active');
  previewEmpty.classList.remove('hidden');
  setTimeout(fitCanvas, 100);
}

function showWelcome() {
  if (state.videoStream) {
    var tracks = state.videoStream.getTracks();
    for (var i = 0; i < tracks.length; i++) tracks[i].stop();
    state.videoStream = null;
  }
  studioScreen.classList.remove('active');
  welcomeScreen.style.display = 'flex';
  state.mode = null;
  lastDetection = null;
  smoothed = null;
}

function showStatus(text, type) {
  previewStatus.textContent = text;
  previewStatus.className = 'preview-status show ' + (type || '');
}

function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

window.addEventListener('DOMContentLoaded', function() {
  welcomeScreen = $('welcomeScreen');
  studioScreen = $('studioScreen');
  userPhoto = $('userPhoto');
  userVideo = $('userVideo');
  glassesCanvas = $('glassesCanvas');
  previewArea = $('previewArea');
  previewEmpty = $('previewEmpty');
  previewStatus = $('previewStatus');
  posControls = $('posControls');
  loadingOverlay = $('loadingOverlay');
  loadingMessage = $('loadingMessage');
  emptyText = $('emptyText');
  toast = $('toast');
  ctx = glassesCanvas.getContext('2d');
  
  $('useCameraBtn').addEventListener('click', startCameraMode);
  $('useUploadBtn').addEventListener('click', startUploadMode);
  $('backBtn').addEventListener('click', showWelcome);
  $('fileInput').addEventListener('change', handleFileSelected);
  
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.pos-btn');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var step = 10;
    if (action === 'up') manualOffset.y -= step;
    else if (action === 'down') manualOffset.y += step;
    else if (action === 'left') manualOffset.x -= step;
    else if (action === 'right') manualOffset.x += step;
    else if (action === 'bigger') manualOffset.scale *= 1.08;
    else if (action === 'smaller') manualOffset.scale *= 0.93;
    redraw();
  });
  
  $('downloadBtn').addEventListener('click', function() {
    if (!lastDetection) { showToast('جرب أولاً'); return; }
    var exportCanvas = document.createElement('canvas');
    var rect = previewArea.getBoundingClientRect();
    exportCanvas.width = rect.width * 2;
    exportCanvas.height = rect.height * 2;
    var ectx = exportCanvas.getContext('2d');
    ectx.scale(2, 2);
    if (state.mode === 'upload') {
      ectx.drawImage(userPhoto, 0, 0, rect.width, rect.height);
    } else {
      ectx.save();
      ectx.scale(-1, 1);
      ectx.drawImage(userVideo, -rect.width, 0, rect.width, rect.height);
      ectx.restore();
    }
    ectx.drawImage(glassesCanvas, 0, 0, rect.width, rect.height);
    ectx.fillStyle = 'rgba(255,255,255,0.85)';
    ectx.font = '700 20px Inter, sans-serif';
    ectx.textAlign = 'right';
    ectx.fillText('ooo', rect.width - 16, rect.height - 16);
    var link = document.createElement('a');
    link.download = 'ooo-clear-grant-' + Date.now() + '.png';
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
    showToast('تم حفظ الصورة ✓');
  });
  
  $('shareBtn').addEventListener('click', function() {
    var text = 'جربت نظارة Clear Grant من ooo 👓';
    if (navigator.share) {
      navigator.share({ title: 'ooo Eyewear', text: text, url: window.location.origin }).catch(function() {});
    } else {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      showToast('تم نسخ النص ✓');
    }
  });
  
  $('buyBtn').addEventListener('click', function() { window.open('/', '_blank'); });
  
  window.addEventListener('resize', function() {
    if (studioScreen.classList.contains('active')) { fitCanvas(); redraw(); }
  });
});
</script>
</body>
</html>
